        .truncate-cell {

            white-space: nowrap;
        }

<body class="bg-slate-900 text-slate-100 min-h-screen p-1 sm:p-2">

    <div class="max-w-4xl mx-auto">
        <header class="mb-2 border-b border-slate-700 pb-1">
            <h1 id="headerTitle" class="text-[16px] sm:text-[50px] font-bold tracking-tight text-cyan-400 leading-tight truncate-cell">
                縉皇居交通 <span id="headerTimestamp" class="font-normal text-slate-300 ml-1">Loading...</span>
            </h1>
        </header>

        <div class="bg-slate-800 rounded-lg shadow-xl overflow-hidden border border-slate-700">
            <div class="overflow-x-auto">
                <table id="etaTable" class="w-full text-left border-collapse table-fixed">
                    <thead>
                        <tr class="bg-slate-700/60 border-b border-slate-700 text-slate-200 font-semibold text-[16px] sm:text-[50px] leading-tight">
                            <th class="p-1 sm:p-3 w-[20%] truncate-cell">開往</th>
                            <th class="p-1 sm:p-3 w-[20%] truncate-cell">路線</th>
                            <th class="p-1 sm:p-3 w-[28%] truncate-cell">車站</th>
                            <th class="p-1 sm:p-3 w-[32%] truncate-cell">分鐘</th>
                        </tr>
                    </thead>
                    <tbody id="etaTableBody" class="divide-y divide-slate-700 text-[16px] sm:text-[50px] leading-tight">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-slate-400 truncate-cell">Loading bus schedules and live APIs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <footer class="mt-2 text-center text-[11px] sm:text-[18px] text-slate-500">
            Ocean Point Private Bus & Public Transit ETA Monitor &bull; Times in HK Time (GMT+8)
        </footer>
    </div>

    <script>
        const busInstructions = [

            },
            { type: 'api', co: 'KMB', route: '234A', direction: '荃灣', stopName: '海韻花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234A/1' },
            { type: 'api', co: 'KMB', route: '234B', direction: '荃灣', stopName: '海韻花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234B/1' },
            { type: 'api', co: 'KMB', route: '53', direction: '荃灣', stopName: '海韻花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/53/1' },
            { type: 'api', co: 'GMB', route: '96C', direction: '荃灣', stopName: '碧堤半島', url: 'https://data.etagmb.gov.hk/eta/route-stop/2008093/2/1' },
            { type: 'api', co: 'KMB', route: '52X', direction: '旺角', stopName: '海韻花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/52X/1' },
            { type: 'api', co: 'CTB', route: '952', direction: '銅鑼灣', stopName: '海韻花園', url: 'https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/002618/952' },
            { type: 'api', co: 'KMB', route: 'A38', direction: '機場', stopName: '深井深慈街', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/5A2A66038B409879/A38/1' },
            { type: 'api', co: 'KMB', route: '52X', direction: '屯門', stopName: '碧堤半島', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/52X/1' },
            { type: 'api', co: 'KMB', route: '53', direction: '元朗', stopName: '碧堤半島', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/53/1' },
            { type: 'api', co: 'CTB', route: '952', direction: '屯門', stopName: '碧堤半島', url: 'https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/002619/952' },
            { type: 'api', co: 'KMB', route: '234C', direction: '觀塘', stopName: '海韻花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234C/1' },
            { type: 'api', co: 'KMB', route: '234D', direction: '觀塘', stopName: '海韻花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234D/1' },
            { type: 'api', co: 'KMB', route: '261B', direction: '九龍站', stopName: '海韻花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/261B/1' },
            { type: 'api', co: 'KMB', route: '48P', direction: '火炭', stopName: '海韻花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/48P/1' },
            { type: 'api', co: 'KMB', route: '52P', direction: '旺角', stopName: '海韻花園', url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/52P/1' }
        ];

        const estateSchedules = {
            'TsuenWantoOceanPointe': {
                col0: [
                    "06:45","07:05","07:25","07:45","08:05","08:25","08:45","09:05","09:25","09:45",
                    "10:05","10:25","10:45","11:05","11:25","11:45","12:05","12:25","12:45","13:05",
                    "13:45","15:05","15:45","16:05","16:25","16:45","17:05","17:25","17:45","18:05",
                    "18:25","18:45","19:05","19:25","19:45","20:05"
                ],
                col1: [
                    "06:45","07:05","07:25","07:45","08:05","08:25","08:45","09:05","09:25","09:45",
                    "10:05","10:25","10:45","11:05","11:25","11:45","12:05","12:25","12:45","13:05",
                    "13:45","15:05","15:45","16:05","16:25","16:45","17:05","17:25","17:45","18:05",
                    "18:25","18:45","19:05","19:25","19:45"
                ],
                col2: [
                    "07:05","07:50","08:35","09:20","10:05","10:50","11:35","12:20","13:05","15:05",
                    "15:50","16:35","17:20","18:05","18:50","19:35"
                ]
            },
            'OceanPointeToTsuenWan': {
                col0: [
                    "06:30","06:50","07:10","07:20","07:30","07:40","07:50","08:00","08:10","08:20",
                    "08:30","08:50","09:10","09:30","09:50","10:10","10:30","10:50","11:10","11:30",
                    "11:50","12:10","12:30","12:50","13:30","14:50","15:30","15:50","16:10","16:30",
                    "16:50","17:10","17:30","17:50","18:10","18:30","18:50","19:10","19:30","19:50"
                ],
                col1: [
                    "06:30","06:50","07:10","07:30","07:50","08:10","08:30","08:50","09:10","09:30",
                    "09:50","10:10","10:30","10:50","11:10","11:30","11:50","12:10","12:30","12:50",
                    "13:30","14:50","15:30","15:50","16:10","16:30","16:50","17:10","17:30","17:50",
                    "18:10","18:30","18:50","19:10","19:30"
                ],
                col2: [
                    "06:50","07:35","08:20","09:05","09:50","10:35","11:20","12:05","12:50","14:50",
                    "15:35","16:20","17:05","17:50","18:35","19:20"
                ]
            }
        };

        let hkHolidaysCache = null;

        async function fetchHKPublicHolidays(year) {
            if (hkHolidaysCache && hkHolidaysCache.year === year) {
                return hkHolidaysCache.dates;
            }
            try {
                const response = await fetch(`https://www.gov.hk/en/about/abouthk/time/data/govhkholidays_${year}.ics`);
                if (!response.ok) throw new Error('Failed to fetch ICS calendar');
                const text = await response.text();
                const dates = [];
                const lines = text.split('\n');
                for (let line of lines) {
                    if (line.startsWith('DTSTART;VALUE=DATE:')) {
                        const dateStr = line.replace('DTSTART;VALUE=DATE:', '').trim();
                        if (dateStr.length === 8) {
                            const formatted = `${dateStr.substring(0,4)}-${dateStr.substring(4,6)}-${dateStr.substring(6,8)}`;
                            dates.push(formatted);
                        }
                    }
                }
                hkHolidaysCache = { year, dates };
                return dates;
            } catch (err) {
                console.warn('Could not fetch government public holidays, falling back to weekend check:', err);
                return [];
            }
        }

        async function getScheduleColumn(now) {
            const year = now.getFullYear();
            const holidays = await fetchHKPublicHolidays(year);
            
            const yearStr = now.getFullYear();
            const monthStr = String(now.getMonth() + 1).padStart(2, '0');
            const dayStr = String(now.getDate()).padStart(2, '0');
            const dateKey = `${yearStr}-${monthStr}-${dayStr}`;

            const dayOfWeek = now.getDay(); // 0 = Sunday, 1 = Mon, ..., 6 = Sat

            if (dayOfWeek === 0 || holidays.includes(dateKey)) {
                return 2; // Sunday or Public Holiday
            }
            if (dayOfWeek === 6) {
                return 1; // Saturday
            }
            return 0; // Monday to Friday
        }

        async function calculateScheduleEtas(scheduleKey, now) {
            const colIndex = await getScheduleColumn(now);
            const schedObj = estateSchedules[scheduleKey];
            let timesList = [];
            if (colIndex === 2) timesList = schedObj.col2;
            else if (colIndex === 1) timesList = schedObj.col1;
            else timesList = schedObj.col0;

            if (!timesList || timesList.length === 0) return [];

            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const etasInMinutes = [];

            for (let timeStr of timesList) {
                const [h, m] = timeStr.split(':').map(Number);
                const busMinutes = h * 60 + m;
                const diff = busMinutes - currentMinutes;
                if (diff >= 0) {
                    etasInMinutes.push(diff);
                }
                if (etasInMinutes.length >= 3) break;
            }
            return etasInMinutes;
        }

        async function fetchApiEtas(url) {
            try {
                const response = await fetch(url, { signal: AbortSignal.timeout(5000) });
                if (!response.ok) return [];
                const json = await response.json();
                if (!json || !json.data) return [];

                const now = new Date();
                const etas = [];

                const etaEntries = Array.isArray(json.data) ? json.data : [json.data];
                for (let item of etaEntries) {
                    if (!item.eta) continue;
                    const etaTime = new Date(item.eta);
                    if (isNaN(etaTime.getTime())) continue;

                    const diffMs = etaTime - now;
                    const diffMins = Math.round(diffMs / 60000);
                    if (diffMins >= 0) {
                        etas.push(diffMins);
                    }
                    if (etas.length >= 3) break;
                }
                return etas;
            } catch (err) {
                console.warn('API fetch error for URL:', url, err);
                return [];
            }
        }

        function renderEtaBadge(etaVal) {
            if (etaVal === null || etaVal === undefined || isNaN(etaVal)) return '';
            let bgColor = 'bg-emerald-600'; // > 15 mins (Green)
            if (etaVal < 9) {
                bgColor = 'bg-rose-600'; // < 9 mins (Red)
            } else if (etaVal >= 9 && etaVal <= 15) {
                bgColor = 'bg-amber-600'; // 9 to 15 mins (Orange)
            }
            return `<span class="inline-block px-2 py-0.5 mr-1 mb-1 rounded text-white font-bold ${bgColor}">${etaVal}</span>`;
        }

        async function updateBusData() {
            const now = new Date();
            
            // Format timestamp: DD-Mon-YYYY HH:MM:SS
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const day = String(now.getDate()).padStart(2, '0');
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('headerTimestamp').textContent = `${day}-${month}-${year} ${hours}:${mins}:${secs}`;

            const tbody = document.getElementById('etaTableBody');
            let rowsHtml = '';

            for (let instr of busInstructions) {
                let etas = [];
                try {
                    if (instr.type === 'schedule') {
                        etas = await calculateScheduleEtas(instr.scheduleKey, now);
                    } else if (instr.type === 'api') {
                        etas = await fetchApiEtas(instr.url);
                    }
                } catch (e) {
                    console.error('Error processing instruction:', instr, e);
                }

                if (!etas || etas.length === 0) {
                    continue;
                }

                let etaHtml = '';
                for (let i = 0; i < Math.min(etas.length, 3); i++) {
                    etaHtml += renderEtaBadge(etas[i]);
                }

                rowsHtml += `
                    <tr class="hover:bg-slate-700/45 transition-colors border-b border-slate-700/50">
                        <td class="p-1 sm:p-3 align-middle text-slate-100 truncate-cell">${instr.direction}</td>
                        <td class="p-1 sm:p-3 align-middle truncate-cell">
                            <span class="inline-block px-2 py-0.5 rounded bg-blue-600 text-white font-bold shadow">${instr.route}</span>
                        </td>
                        <td class="p-1 sm:p-3 align-middle text-slate-200 truncate-cell">${instr.stopName}</td>
                        <td class="p-1 sm:p-3 align-middle text-left whitespace-nowrap truncate-cell">${etaHtml}</td>
                    </tr>
                `;
            }

            if (rowsHtml === '') {
                rowsHtml = `<tr><td colspan="4" class="p-4 text-center text-slate-400 truncate-cell">No active bus services available at the moment.</td></tr>`;
            }

            tbody.innerHTML = rowsHtml;
        }

        window.onload = function() {
            updateBusData();
            setInterval(updateBusData, 10000);
        };
    </script>
</body>
</html>
