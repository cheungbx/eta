<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邨巴 Bus ETA 1.1</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 8px;
        }
        /* Responsive font sizes */
        .app-title {
            font-size: 15px;
        }
        .app-header {
            font-size: 15px;
        }
        .app-data {
            font-size: 15px;
        }
        @media (min-width: 768px) {
            .app-title { font-size: 40px; }
            .app-header { font-size: 40px; }
            .app-data { font-size: 40px; }
        }
        @media (min-width: 1024px) {
            .app-title { font-size: 50px; }
            .app-header { font-size: 50px; }
            .app-data { font-size: 50px; }
        }
    </style>
</head>
<body class="bg-black text-white p-2">
    <div class="w-full max-w-7xl mx-auto">
        <!-- Title Line -->
        <div id="title-line" class="app-title font-bold mb-2 truncate">
            縉皇居交通 <span id="current-datetime">01-Aug-2026 19:49:00</span>
        </div>

        <!-- Bus Table -->
        <div class="w-full overflow-x-auto">
            <table class="w-full border-collapse table-fixed">
                <thead>
                    <tr class="app-header text-left border-b border-gray-800">
                        <th class="py-1 px-1 overflow-hidden whitespace-nowrap text-ellipsis" style="width: 20%;">開往</th>
                        <th class="py-1 px-1 overflow-hidden whitespace-nowrap text-ellipsis" style="width: 20%;">路線</th>
                        <th class="py-1 px-1 overflow-hidden whitespace-nowrap text-ellipsis" style="width: 28%;">車站</th>
                        <th class="py-1 px-1 overflow-hidden whitespace-nowrap text-ellipsis" style="width: 32%;">分鐘</th>
                    </tr>
                </thead>
                <tbody id="bus-table-body" class="app-data">
                    <!-- Rows will be populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Ocean Point Private Shuttle Schedules parsed from provided image schedule tables
        const shuttleSchedules = {
            "TsuenWantoOceanPointe.jpg": {
                // Column 0: Mon-Fri, Column 1: Sat, Column 2: Sun & PH
                colTimes: [
                    ["06:45", "07:05", "07:25", "07:45", "08:05", "08:25", "08:45", "09:05", "09:25", "09:45", "10:05", "10:25", "10:45", "11:05", "11:25", "11:45", "12:05", "12:25", "12:45", "13:05", "13:45", "15:05", "15:45", "16:05", "16:25", "16:45", "17:05", "17:25", "17:45", "18:05", "18:25", "18:45", "19:05", "19:25", "19:45", "20:05"],
                    ["06:45", "07:05", "07:25", "07:45", "08:05", "08:25", "08:45", "09:05", "09:25", "09:45", "10:05", "10:25", "10:45", "11:05", "11:25", "11:45", "12:05", "12:25", "12:45", "13:05", "13:45", "15:05", "15:45", "16:05", "16:25", "16:45", "17:05", "17:25", "17:45", "18:05", "18:25", "18:45", "19:05", "19:25", "19:45"],
                    ["07:05", "07:50", "08:35", "09:20", "10:05", "10:50", "11:35", "12:20", "13:05", "15:05", "15:50", "16:35", "17:20", "18:05", "18:50", "19:35"]
                ]
            },
            "OceanPointeToTsuenWan.jpg": {
                colTimes: [
                    ["06:30", "06:50", "07:10", "07:20", "07:30", "07:40", "07:50", "08:00", "08:10", "08:20", "08:30", "08:50", "09:10", "09:30", "09:50", "10:10", "10:30", "10:50", "11:10", "11:30", "11:50", "12:10", "12:30", "12:50", "13:30", "14:50", "15:30", "15:50", "16:10", "16:30", "16:50", "17:10", "17:30", "17:50", "18:10", "18:30", "18:50", "19:10", "19:30", "19:50"],
                    ["06:30", "06:50", "07:10", "07:30", "07:50", "08:10", "08:30", "08:50", "09:10", "09:30", "09:50", "10:10", "10:30", "10:50", "11:10", "11:30", "11:50", "12:10", "12:30", "12:50", "13:30", "14:50", "15:30", "15:50", "16:10", "16:30", "16:50", "17:10", "17:30", "17:50", "18:10", "18:30", "18:50", "19:10", "19:30"],
                    ["06:50", "07:35", "08:20", "09:05", "09:50", "10:35", "11:20", "12:05", "12:50", "14:50", "15:35", "16:20", "17:05", "17:50", "18:35", "19:20"]
                ]
            }
        };

        const instructions = [
            { busCoId: "屋苑", route: "邨巴", direction: "縉皇居", stopName: "荃灣", targetSrc: "TsuenWantoOceanPointe.jpg" },
            { busCoId: "屋苑", route: "邨巴", direction: "荃灣", stopName: "縉皇居", targetSrc: "OceanPointeToTsuenWan.jpg" },
            { busCoId: "KMB", route: "234A", direction: "荃灣", stopName: "海韻花園", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234A/1" },
            { busCoId: "KMB", route: "234B", direction: "荃灣", stopName: "海韻花園", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234B/1" },
            { busCoId: "KMB", route: "53", direction: "荃灣", stopName: "海韻花園", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/53/1" },
            { busCoId: "KMB", route: "52X", direction: "旺角", stopName: "海韻花園", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/52X/1" },
            { busCoId: "CTB", route: "952", direction: "銅鑼灣", stopName: "海韻花園", targetSrc: "https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/002618/952" },
            { busCoId: "KMB", route: "A38", direction: "機場", stopName: "深井深慈街", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/5A2A66038B409879/A38/1" },
            { busCoId: "KMB", route: "52X", direction: "屯門", stopName: "碧堤半島", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/52X/1" },
            { busCoId: "CTB", route: "952", direction: "屯門", stopName: "碧堤半島", targetSrc: "https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/002619/952" },
            { busCoId: "KMB", route: "53", direction: "元朗", stopName: "碧堤半島", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/53/1" },
            { busCoId: "KMB", route: "234C", direction: "觀塘", stopName: "海韻花園", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234C/1" },
            { busCoId: "KMB", route: "234D", direction: "觀塘", stopName: "海韻花園", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234D/1" },
            { busCoId: "KMB", route: "261B", direction: "九龍站", stopName: "海韻花園", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/261B/1" },
            { busCoId: "KMB", route: "48P", direction: "火炭", stopName: "海韻花園", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/48P/1" },
            { busCoId: "KMB", route: "52P", direction: "旺角", stopName: "海韻花園", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/52P/1" }
        ];

        let cachedHolidays = null;

        async function fetchHongKongHolidays(year) {
            if (cachedHolidays && cachedHolidays.year === year) {
                return cachedHolidays.dates;
            }
            try {
                // Official HK Government 1823 public holidays API in JSON format
                const res = await fetch(`https://www.1823.gov.hk/common/ical/v1/en.json`);
                if (!res.ok) return [];
                const data = await res.json();
                const holidays = [];
                if (data && data.vcalendar) {
                    for (const cal of data.vcalendar) {
                        if (cal.vevent) {
                            for (const ev of cal.vevent) {
                                // dtstart can be an array or string like "20260101" or [ "20260101", { ... } ]
                                let dt = ev.dtstart;
                                if (Array.isArray(dt)) dt = dt[0];
                                if (typeof dt === 'string' && dt.length >= 8) {
                                    const y = dt.substring(0, 4);
                                    const m = dt.substring(4, 6);
                                    const d = dt.substring(6, 8);
                                    if (y === String(year)) {
                                        holidays.add(`${y}-${m}-${d}`);
                                    }
                                }
                            }
                        }
                    }
                }
                cachedHolidays = { year, dates: holidays };
                return holidays;
            } catch (e) {
                console.warn("Could not fetch government public holidays, falling back to day-of-week check.", e);
                return [];
            }
        }

        async function getScheduleColumnIndex(now) {
            const year = now.getFullYear();
            const holidays = await fetchHongKongHolidays(year);
            const dateStr = `${year}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            
            const dayOfWeek = now.getDay(); // 0: Sun, 1-5: Mon-Fri, 6: Sat
            
            if (dayOfWeek === 0 || holidays.includes(dateStr)) {
                return 2; // Sunday & Public Holiday
            } else if (dayOfWeek === 6) {
                return 1; // Saturday
            } else {
                return 0; // Monday to Friday
            }
        }

        async function calculateShuttleEtas(targetSrc, now) {
            const scheduleObj = shuttleSchedules[targetSrc];
            if (!scheduleObj) return [];

            const colIndex = await getScheduleColumnIndex(now);
            const times = scheduleObj.colTimes[colIndex] || [];

            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const etas = [];

            for (const timeStr of times) {
                const [h, m] = timeStr.split(':').map(Number);
                const busMinutes = h * 60 + m;
                const diff = busMinutes - currentMinutes;
                if (diff >= 0) {
                    etas.push(diff);
                    if (etas.length >= 3) break;
                }
            }
            return etas;
        }

        async function fetchApiEtas(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) return [];
                const data = await response.json();
                const etas = [];

                // Check KMB format vs Citybus format
                if (data.type === "ETA" && Array.isArray(data.data)) {
                    // KMB API format
                    const now = new Date();
                    for (const item of data.data) {
                        if (item.eta) {
                            const etaTime = new Date(item.eta);
                            const diffMinutes = Math.round((etaTime - now) / 60000);
                            if (diffMinutes >= 0) {
                                etas.push(diffMinutes);
                            }
                        }
                        if (etas.length >= 3) break;
                    }
                } else if (data.type === "ETA-Route-Stop" && data.data && Array.isArray(data.data.eta)) {
                    // Citybus API format
                    for (const item of data.data.eta) {
                        if (typeof item.diff === 'number' && item.diff >= 0) {
                            etas.push(item.diff);
                        } else if (item.timestamp) {
                            const now = new Date();
                            const etaTime = new Date(item.timestamp);
                            const diffMinutes = Math.round((etaTime - now) / 60000);
                            if (diffMinutes >= 0) {
                                etas.push(diffMinutes);
                            }
                        }
                        if (etas.length >= 3) break;
                    }
                }
                return etas;
            } catch (e) {
                console.error("API fetch error for URL:", url, e);
                return [];
            }
        }

        function getEtaBackgroundColor(eta) {
            if (eta < 9) {
                return 'background-color: #ef4444; color: #ffffff;'; // Red
            } else if (eta >= 9 && eta <= 15) {
                return 'background-color: #f97316; color: #ffffff;'; // Orange
            } else {
                return 'background-color: #22c55e; color: #ffffff;'; // Green
            }
        }

        async function updateBusData() {
            const now = new Date();
            
            // Format title date and time exactly as requested
            const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
            const day = String(now.getDate()).padStart(2, '0');
            const mon = months[now.getMonth()];
            const yr = now.getFullYear();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            
            const datetimeStr = `${day}-${mon}-${yr} ${hh}:${mm}:${ss}`;
            document.getElementById('current-datetime').textContent = datetimeStr;

            const tbody = document.getElementById('bus-table-body');
            let rowsHtml = '';

            for (const inst of instructions) {
                let etas = [];
                if (inst.busCoId === "屋苑") {
                    etas = await calculateShuttleEtas(inst.targetSrc, now);
                } else {
                    etas = await fetchApiEtas(inst.targetSrc);
                }

                // Skip the route if there are no more buses for the current date
                if (!etas || etas.length === 0) {
                    continue;
                }

                // Format ETAs with colored rectangular backgrounds
                let etaHtmls = [];
                for (let i = 0; i < Math.min(etas.length, 3); i++) {
                    const val = etas[i];
                    const style = getEtaBackgroundColor(val);
                    etaHtmls.push(`<span class="inline-block px-1.5 py-0.5 rounded mr-1" style="${style}">${val}</span>`);
                }

                rowsHtml += `
                    <tr class="border-b border-gray-900">
                        <td class="py-1 px-1 overflow-hidden whitespace-nowrap text-ellipsis">${inst.direction}</td>
                        <td class="py-1 px-1 overflow-hidden whitespace-nowrap text-ellipsis"><span class="inline-block px-1 bg-blue-600 text-white rounded">${inst.route}</span></td>
                        <td class="py-1 px-1 overflow-hidden whitespace-nowrap text-ellipsis">${inst.stopName}</td>
                        <td class="py-1 px-1 overflow-hidden whitespace-nowrap text-ellipsis">${etaHtmls.join(' ')}</td>
                    </tr>
                `;
            }

            tbody.innerHTML = rowsHtml;
        }

        window.onload = function() {
            updateBusData();
            // Hidden Autorefresh every 10 seconds (no buttons or messages shown)
            setInterval(updateBusData, 10000);
        };
    </script>
</body>
</html>
